spring.application.name=seu-barbeiro

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/yourbarber}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:secret}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-must-be-at-least-256-bits-long-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

admin.default-email=${ADMIN_EMAIL:admin@yourbarber.com}
admin.default-password=${ADMIN_PASSWORD:ChangeMe123!}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:no-reply@yourbarber.com}

verification.code-expiration-minutes=${VERIFICATION_CODE_EXPIRATION_MINUTES:15}

# Comma-separated extra origins allowed by CORS, e.g. a deployed web frontend
# (https://your-app.vercel.app). Local dev origins are always allowed.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
