spring.application.name=seu-barbeiro

spring.datasource.url=jdbc:postgresql://localhost:5432/yourbarber
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:secret}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-must-be-at-least-256-bits-long-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

admin.default-email=${ADMIN_EMAIL:admin@yourbarber.com}
admin.default-password=${ADMIN_PASSWORD:ChangeMe123!}
