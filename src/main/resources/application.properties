spring.application.name=seu-barbeiro

# Loads `.env` (repo root) as properties, so values set there (DB creds, mail
# credentials, JWT secret, ...) reach the app without a manual `export` step.
# `optional:` means a missing file (e.g. in CI) is not an error.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/yourbarber}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:secret}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-must-be-at-least-256-bits-long-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

admin.default-email=${ADMIN_EMAIL:admin@yourbarber.com}
admin.default-password=${ADMIN_PASSWORD:ChangeMe123!}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:no-reply@yourbarber.com}

verification.code-expiration-minutes=${VERIFICATION_CODE_EXPIRATION_MINUTES:15}

# Monthly barber subscription (paid via Pix straight to the developer's own
# personal account -- no payment gateway). pix-key is required for
# POST /api/subscriptions/me/pix to work; leave unset to disable it locally.
subscription.pix-key=${SUBSCRIPTION_PIX_KEY:}
subscription.merchant-name=${SUBSCRIPTION_MERCHANT_NAME:Seu Barbeiro}
subscription.amount=${SUBSCRIPTION_AMOUNT:30.00}
subscription.period-days=${SUBSCRIPTION_PERIOD_DAYS:30}

# Comma-separated extra origins allowed by CORS, e.g. a deployed web frontend
# (https://your-app.vercel.app). Local dev origins are always allowed.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Web Push (VAPID). Self-generated key pair (no external account needed) --
# only identifies this server to browser push services, unlike native
# iOS/Android push which still needs a real Firebase/Apple project. Rotate by
# generating a new pair (`npx web-push generate-vapid-keys`) and overriding
# via env vars; every existing browser subscription becomes invalid when you do.
